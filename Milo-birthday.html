<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>A Gift</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Epilogue:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --pigment: #8A5CF6;
      --pigment-rgb: 138, 92, 246;
      --canvas-bg: #09090b;
      --ink-primary: #F4F4F5;
      --ink-secondary: rgba(244, 244, 245, 0.70);
      --ink-faint: rgba(244, 244, 245, 0.35);
      --surface: #0a0a0c;
      --surface-shadow: rgba(0, 0, 0, 0.95);

      --font-display: 'Libre Baskerville', Georgia, serif;
      --font-body: 'Epilogue', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--canvas-bg);
      font-family: var(--font-body);
      color: var(--ink-primary);
      touch-action: none;
      transition: background-color 1s ease;
    }

    #pigment-wash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          circle at 45% 40%,
          rgba(var(--pigment-rgb), 0.08) 0%,
          rgba(var(--pigment-rgb), 0.015) 50%,
          transparent 80%
        );
      opacity: 0;
      transition: opacity 3s ease;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* ==========================================================================
       MEMORY FRAGMENTS
       ========================================================================== */

    #content-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .memory-stage {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease, filter 1.2s ease;
    }

    #mem-0 .photo-frame {
      transform: rotate(-1.5deg) translateY(-2vh);
    }

    #mem-1 .photo-frame {
      transform: rotate(1deg) translateY(2vh);
    }

    #mem-2 .photo-frame {
      transform: rotate(-0.5deg) translateY(-1vh);
    }

    .memory-stage.active {
      opacity: 1;
      visibility: visible;
    }

    .memory-stage.retiring {
      opacity: 0.15;
      filter: blur(4px) grayscale(0.5);
      z-index: -1;
      transition: opacity 2s ease, filter 2s ease;
    }

    /* ==========================================================================
       FULL-PHOTO FRAME
       ========================================================================== */

    .photo-frame {
      position: relative;
      width: min(72vw, 280px);
      aspect-ratio: 3.5 / 5;
      background: var(--surface);
      box-shadow:
        0 30px 60px -20px var(--surface-shadow),
        0 0 80px -20px rgba(var(--pigment-rgb), 0.12),
        0 0 0 1px rgba(var(--pigment-rgb), 0.05);
      overflow: hidden;
      isolation: isolate;
    }

    /*
      The same photograph fills the frame underneath.
      Because it is blurred and enlarged, it reads as
      the photograph continuing outward rather than a border.
    */
    .photo-frame::before {
      content: '';
      position: absolute;
      inset: -22%;
      background-image: var(--photo-bg);
      background-size: cover;
      background-position: center;
      filter: blur(28px);
      transform: scale(1.08);
      opacity: 0.60;
      z-index: -1;
    }

    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(var(--pigment-rgb), 0.10);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 2;
    }

    /*
      contain keeps the entire original photograph visible.
      No part of Milo gets cut off.
    */
    .photo-frame img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      filter: contrast(1.05) brightness(0.95);
    }

    .memory-text-wrap {
      margin-top: 32px;
      text-align: center;
      max-width: min(76vw, 320px);
      opacity: 0;
      transition: opacity 1.4s ease 0.4s;
    }

    #mem-0 .memory-text-wrap {
      transform: translateX(-4px);
    }

    #mem-1 .memory-text-wrap {
      transform: translateX(6px);
    }

    #mem-2 .memory-text-wrap {
      transform: translateX(-2px);
    }

    .memory-stage.revealed .memory-text-wrap {
      opacity: 1;
    }

    .memory-date {
      font-family: var(--font-body);
      font-size: 13px;
      font-style: italic;
      color: var(--ink-secondary);
      margin-bottom: 12px;
    }

    .memory-caption {
      font-family: var(--font-display);
      font-size: clamp(20px, 5.5vw, 26px);
      line-height: 1.35;
      font-weight: 300;
      color: var(--ink-primary);
    }

    /* ==========================================================================
       FINALE
       ========================================================================== */

    #finale-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      z-index: 5;
      transition: opacity 2s ease;
      padding: 0 24px;
    }

    #finale-layer.show {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .composition-cluster {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      pointer-events: none;
    }

    .cluster-fragment {
      position: absolute;
      width: min(65vw, 240px);
      aspect-ratio: 3.5 / 5;
      opacity: 0;
      filter: blur(12px);
      transition: opacity 3s ease, filter 3s ease;
      will-change: transform;
      overflow: hidden;
    }

    #finale-layer.show .cluster-fragment {
      opacity: 0.3;
      filter: blur(4px);
    }

    @keyframes drift1 {
      0%, 100% {
        transform: translate(-15vw, -10vh) rotate(-8deg);
      }

      50% {
        transform: translate(-13.5vw, -11.5vh) rotate(-7deg);
      }
    }

    @keyframes drift2 {
      0%, 100% {
        transform: translate(10vw, -15vh) rotate(5deg);
      }

      50% {
        transform: translate(11.5vw, -13.5vh) rotate(6deg);
      }
    }

    @keyframes drift3 {
      0%, 100% {
        transform: translate(5vw, 15vh) rotate(-4deg);
      }

      50% {
        transform: translate(3.5vw, 16.5vh) rotate(-5deg);
      }
    }

    #finale-layer.show .cluster-fragment:nth-child(1) {
      animation: drift1 18s ease-in-out infinite;
    }

    #finale-layer.show .cluster-fragment:nth-child(2) {
      animation: drift2 22s ease-in-out infinite;
      animation-delay: -3s;
    }

    #finale-layer.show .cluster-fragment:nth-child(3) {
      animation: drift3 20s ease-in-out infinite;
      animation-delay: -7s;
    }

    /*
      Entire photos remain visible in the finale too.
    */
    .cluster-fragment img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    .identity-core {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -12vh;
    }

    .recipient-name {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 18vw, 8rem);
      line-height: 0.85;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.98);
      transition:
        opacity 2.5s ease 0.8s,
        filter 2.5s ease 0.8s,
        transform 2.5s cubic-bezier(0.2, 1, 0.3, 1) 0.8s;
    }

    #finale-layer.show .recipient-name {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    .identity-context {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 2s ease 1.8s;
    }

    #finale-layer.show .identity-context {
      opacity: 1;
    }

    .identity-detail {
      font-family: var(--font-body);
      font-size: 14px;
      font-style: italic;
      color: var(--pigment);
    }

    .closing-letter {
      position: absolute;
      bottom: clamp(30px, 8vh, 60px);
      width: 100%;
      max-width: 440px;
      text-align: center;
      z-index: 10;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 2s ease 2.5s,
        transform 2s ease 2.5s;
      padding: 0 24px;
    }

    #finale-layer.show .closing-letter {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-body {
      font-family: var(--font-body);
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.5;
      color: var(--ink-secondary);
      margin-bottom: 24px;
      white-space: pre-wrap;
    }

    .letter-signature {
      font-family: var(--font-display);
      font-size: clamp(22px, 5.5vw, 28px);
      font-style: italic;
      color: var(--ink-primary);
    }

    .letter-relation {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--ink-faint);
      margin-top: 6px;
    }

    /* ==========================================================================
       POWDER
       ========================================================================== */

    #canvas-powder {
      position: absolute;
      inset: 0;
      z-index: 2;
      touch-action: none;
      background: transparent;
      pointer-events: auto;
    }
  </style>
</head>

<body>

  <div id="pigment-wash"></div>

  <main id="stage">

    <div id="content-layer">

      <div class="memory-stage" id="mem-0">
        <div class="photo-frame" id="wrap-0">
          <img id="img-0" src="" alt="" draggable="false">
        </div>

        <div class="memory-text-wrap">
          <div class="memory-date" id="date-0"></div>
          <div class="memory-caption" id="text-0"></div>
        </div>
      </div>

      <div class="memory-stage" id="mem-1">
        <div class="photo-frame" id="wrap-1">
          <img id="img-1" src="" alt="" draggable="false">
        </div>

        <div class="memory-text-wrap">
          <div class="memory-date" id="date-1"></div>
          <div class="memory-caption" id="text-1"></div>
        </div>
      </div>

      <div class="memory-stage" id="mem-2">
        <div class="photo-frame" id="wrap-2">
          <img id="img-2" src="" alt="" draggable="false">
        </div>

        <div class="memory-text-wrap">
          <div class="memory-date" id="date-2"></div>
          <div class="memory-caption" id="text-2"></div>
        </div>
      </div>

    </div>

    <div id="finale-layer">

      <div class="composition-cluster">

        <div class="cluster-fragment">
          <img id="frag-0" src="" alt="">
        </div>

        <div class="cluster-fragment">
          <img id="frag-1" src="" alt="">
        </div>

        <div class="cluster-fragment">
          <img id="frag-2" src="" alt="">
        </div>

      </div>

      <div class="identity-core">
        <h1 class="recipient-name" id="finale-name"></h1>
        <div class="identity-context" id="finale-context"></div>
      </div>

      <div class="closing-letter">
        <div class="letter-body" id="finale-msg"></div>
        <div class="letter-signature" id="finale-from"></div>
        <div class="letter-relation" id="finale-relation"></div>
      </div>

    </div>

    <canvas id="canvas-powder"></canvas>

  </main>

  <script>
    /* ==========================================================================
       CONFIG
       ========================================================================== */

    const CONFIG = {
      recipientName: "Milo",
      nickname: "Milo Bear",
      age: 2,

      senderName: "Jarock",
      relationship: "Your big best friend",

      favoriteColor: "#6FAF8F",

      photos: [
        "photo-1.jpg",
        "photo-2.jpg",
        "photo-3.jpg"
      ],

      memories: [
        {
          date: "Just a sleepy Milo",
          text: "Milo completely knocked out, sleeping peacefully."
        },
        {
          date: "Milo & Shiloh",
          text: "Milo spending a little time with his brother Shiloh."
        },
        {
          date: "Just being Milo",
          text: "Milo laying down on the ground, just being his goofy little self."
        }
      ],

      message: "Happy 2nd birthday, Milo. You’re my little best friend, and somehow you make every day better just by being around. I’m glad I get to grow up with you. Love you, buddy."
    };

    /* ==========================================================================
       PIGMENT ENGINE
       ========================================================================== */

    function hexToRgb(hex) {
      let clean = hex.replace('#', '').trim();

      if (clean.length === 3) {
        clean = clean
          .split('')
          .map(c => c + c)
          .join('');
      }

      const int = parseInt(clean, 16) || 0;

      return {
        r: (int >> 16) & 255,
        g: (int >> 8) & 255,
        b: int & 255
      };
    }

    function getLuminance(r, g, b) {
      const a = [r, g, b].map(v => {
        v /= 255;

        return v <= 0.03928
          ? v / 12.92
          : Math.pow((v + 0.055) / 1.055, 2.4);
      });

      return (
        0.2126 * a[0] +
        0.7152 * a[1] +
        0.0722 * a[2]
      );
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;

      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    const rgb = hexToRgb(
      CONFIG.favoriteColor || "#8A5CF6"
    );

    const lum = getLuminance(
      rgb.r,
      rgb.g,
      rgb.b
    );

    const root =
      document.documentElement;

    root.style.setProperty(
      '--pigment',
      CONFIG.favoriteColor
    );

    root.style.setProperty(
      '--pigment-rgb',
      `${rgb.r}, ${rgb.g}, ${rgb.b}`
    );

    let powderTone = {
      r: 18,
      g: 18,
      b: 24
    };

    if (lum > 0.55) {

      root.style.setProperty(
        '--canvas-bg',
        '#09090b'
      );

      root.style.setProperty(
        '--ink-primary',
        '#F4F4F5'
      );

      root.style.setProperty(
        '--ink-secondary',
        'rgba(244, 244, 245, 0.70)'
      );

      root.style.setProperty(
        '--ink-faint',
        'rgba(244, 244, 245, 0.35)'
      );

      root.style.setProperty(
        '--surface',
        '#0a0a0c'
      );

      root.style.setProperty(
        '--surface-shadow',
        'rgba(0, 0, 0, 0.95)'
      );

      root.style.setProperty(
        '--pigment',
        CONFIG.favoriteColor
      );

      powderTone = {
        r: Math.floor(rgb.r * 0.40 + 12),
        g: Math.floor(rgb.g * 0.40 + 12),
        b: Math.floor(rgb.b * 0.40 + 14)
      };

    } else {

      const bgR =
        Math.floor(rgb.r * 0.04 + 8);

      const bgG =
        Math.floor(rgb.g * 0.04 + 8);

      const bgB =
        Math.floor(rgb.b * 0.04 + 10);

      root.style.setProperty(
        '--canvas-bg',
        `rgb(${bgR}, ${bgG}, ${bgB})`
      );

      root.style.setProperty(
        '--ink-primary',
        '#F4F4F5'
      );

      root.style.setProperty(
        '--ink-secondary',
        'rgba(244, 244, 245, 0.70)'
      );

      root.style.setProperty(
        '--ink-faint',
        'rgba(244, 244, 245, 0.35)'
      );

      root.style.setProperty(
        '--surface',
        '#0a0a0c'
      );

      root.style.setProperty(
        '--surface-shadow',
        'rgba(0, 0, 0, 0.85)'
      );

      if (lum < 0.10) {
        root.style.setProperty(
          '--pigment',
          '#A1A1AA'
        );
      }

      powderTone = {
        r: Math.floor(rgb.r * 0.40 + 12),
        g: Math.floor(rgb.g * 0.40 + 12),
        b: Math.floor(rgb.b * 0.40 + 14)
      };
    }

    /* ==========================================================================
       POPULATE CONTENT
       ========================================================================== */

    for (let i = 0; i < 3; i++) {

      const img =
        document.getElementById(`img-${i}`);

      const frag =
        document.getElementById(`frag-${i}`);

      const dateEl =
        document.getElementById(`date-${i}`);

      const textEl =
        document.getElementById(`text-${i}`);

      const wrapper =
        document.getElementById(`wrap-${i}`);

      if (CONFIG.photos[i]) {

        img.src =
          CONFIG.photos[i];

        frag.src =
          CONFIG.photos[i];

        /*
          This supplies the blurred continuation
          behind the complete photograph.
        */
        wrapper.style.setProperty(
          '--photo-bg',
          `url("${CONFIG.photos[i]}")`
        );
      }

      if (CONFIG.memories[i]) {

        dateEl.textContent =
          CONFIG.memories[i].date;

        textEl.textContent =
          CONFIG.memories[i].text;
      }
    }

    /* ==========================================================================
       FINALE IDENTITY
       ========================================================================== */

    document
      .getElementById('finale-name')
      .textContent =
      CONFIG.recipientName;

    const contextBox =
      document.getElementById(
        'finale-context'
      );

    if (CONFIG.age) {

      const birthdayEl =
        document.createElement('div');

      birthdayEl.className =
        'identity-detail';

      birthdayEl.textContent =
        `Happy ${getOrdinal(CONFIG.age)} Birthday${CONFIG.nickname ? `, ${CONFIG.nickname}` : ''}`;

      contextBox.appendChild(
        birthdayEl
      );
    }

    /* ==========================================================================
       FINALE MESSAGE
       ========================================================================== */

    document
      .getElementById('finale-msg')
      .textContent =
      CONFIG.message;

    document
      .getElementById('finale-from')
      .textContent =
      CONFIG.senderName || "";

    document
      .getElementById('finale-relation')
      .textContent =
      CONFIG.relationship || "";

    /* ==========================================================================
       CANVAS
       ========================================================================== */

    const canvas =
      document.getElementById(
        'canvas-powder'
      );

    const ctx =
      canvas.getContext('2d');

    let W = 0;
    let H = 0;
    let dpr = 1;

    const puffCanvas =
      document.createElement(
        'canvas'
      );

    const puffCtx =
      puffCanvas.getContext('2d');

    const PUFF_DIAMETER = 64;

    puffCanvas.width =
      PUFF_DIAMETER;

    puffCanvas.height =
      PUFF_DIAMETER;

    function buildPuffSprite() {

      puffCtx.clearRect(
        0,
        0,
        PUFF_DIAMETER,
        PUFF_DIAMETER
      );

      const rad =
        PUFF_DIAMETER / 2;

      const grad =
        puffCtx.createRadialGradient(
          rad,
          rad,
          0,
          rad,
          rad,
          rad
        );

      const col =
        `rgb(${powderTone.r}, ${powderTone.g}, ${powderTone.b})`;

      grad.addColorStop(
        0,
        col
      );

      grad.addColorStop(
        0.72,
        col
      );

      grad.addColorStop(
        1,
        `rgba(
          ${powderTone.r},
          ${powderTone.g},
          ${powderTone.b},
          0
        )`
      );

      puffCtx.fillStyle =
        grad;

      puffCtx.beginPath();

      puffCtx.arc(
        rad,
        rad,
        rad,
        0,
        Math.PI * 2
      );

      puffCtx.fill();
    }

    buildPuffSprite();

    function resize() {

      W =
        window.innerWidth;

      H =
        window.innerHeight;

      dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      canvas.width =
        W * dpr;

      canvas.height =
        H * dpr;

      canvas.style.width =
        W + 'px';

      canvas.style.height =
        H + 'px';

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );
    }

    window.addEventListener(
      'resize',
      resize
    );

    resize();

    /* ==========================================================================
       POWDER ENGINE
       ========================================================================== */

    let particles = [];
    let currentStep = 0;
    let isTransitioning = false;
    let totalCoverCount = 0;
    let clearedCount = 0;

    class PowderParticle {

      constructor(
        x,
        y,
        radius,
        isBaseCover = true
      ) {

        this.x = x;
        this.y = y;
        this.radius = radius;
        this.isBaseCover =
          isBaseCover;

        this.active = false;
        this.alpha = 1.0;

        this.vx = 0;
        this.vy = 0;

        this.scale = 1.0;

        this.decay =
          0.024 +
          Math.random() * 0.018;
      }

      disperse(
        touchX,
        touchY,
        dragVx = 0,
        dragVy = 0
      ) {

        if (this.active) return;

        this.active = true;

        const dx =
          this.x - touchX;

        const dy =
          this.y - touchY;

        const dist =
          Math.hypot(dx, dy) || 1;

        const speed =
          Math.min(
            8,
            (1 - dist / 55) * 5 + 2
          );

        this.vx =
          (dx / dist) * speed +
          dragVx * 0.28 +
          (Math.random() - 0.5) * 1.5;

        this.vy =
          (dy / dist) * speed +
          dragVy * 0.28 -
          Math.random() * 1.8;
      }

      update() {

        if (this.active) {

          this.x += this.vx;
          this.y += this.vy;

          this.vx *= 0.93;
          this.vy *= 0.93;

          this.scale += 0.015;
          this.alpha -= this.decay;
        }
      }

      draw() {

        if (this.alpha <= 0) return;

        ctx.globalAlpha =
          Math.max(
            0,
            this.alpha
          );

        const drawRadius =
          this.radius *
          this.scale;

        ctx.drawImage(
          puffCanvas,
          this.x - drawRadius,
          this.y - drawRadius,
          drawRadius * 2,
          drawRadius * 2
        );
      }
    }

    function generateCoverForMemory(step) {

      currentStep =
        step;

      clearedCount =
        0;

      totalCoverCount =
        0;

      document
        .querySelectorAll(
          '.memory-stage'
        )
        .forEach(
          (el, i) => {

            el.classList.toggle(
              'active',
              i === step
            );
          }
        );

      const wrapper =
        document.getElementById(
          `wrap-${step}`
        );

      const rect =
        wrapper.getBoundingClientRect();

      const pad = 12;
      const stepSize = 13;
      const pRadius = 26;

      const startX =
        rect.left - pad;

      const endX =
        rect.right + pad;

      const startY =
        rect.top - pad;

      const endY =
        rect.bottom + pad;

      const newParticles = [];

      for (
        let y = startY;
        y <= endY;
        y += stepSize
      ) {

        for (
          let x = startX;
          x <= endX;
          x += stepSize
        ) {

          const jitterX =
            (Math.random() - 0.5) * 4;

          const jitterY =
            (Math.random() - 0.5) * 4;

          const isInsidePhoto =
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom;

          const p =
            new PowderParticle(
              x + jitterX,
              y + jitterY,
              pRadius,
              isInsidePhoto
            );

          newParticles.push(p);

          if (isInsidePhoto) {
            totalCoverCount++;
          }
        }
      }

      for (let i = 0; i < 90; i++) {

        const x =
          rect.left +
          Math.random() *
          rect.width +
          (Math.random() - 0.5) * 36;

        const y =
          rect.top +
          Math.random() *
          rect.height +
          (Math.random() - 0.5) * 36;

        newParticles.push(
          new PowderParticle(
            x,
            y,
            pRadius *
              (0.8 +
              Math.random() * 0.4),
            false
          )
        );
      }

      particles =
        particles
          .filter(
            p =>
              p.active &&
              p.alpha > 0
          )
          .concat(
            newParticles
          );

      isTransitioning =
        false;

      document
        .getElementById(
          'pigment-wash'
        )
        .style.opacity =
        '0.8';
    }

    /* ==========================================================================
       SWIPE
       ========================================================================== */

    let isInteracting = false;
    let lastX = 0;
    let lastY = 0;

    const SWIPE_RADIUS = 52;

    function applyWipeAt(
      x,
      y,
      vx,
      vy
    ) {

      if (isTransitioning)
        return;

      for (
        let i = 0;
        i < particles.length;
        i++
      ) {

        const p =
          particles[i];

        if (!p.active) {

          const d =
            Math.hypot(
              p.x - x,
              p.y - y
            );

          if (
            d <
            SWIPE_RADIUS
          ) {

            p.disperse(
              x,
              y,
              vx,
              vy
            );

            if (
              p.isBaseCover
            ) {
              clearedCount++;
            }
          }
        }
      }

      if (
        totalCoverCount > 0 &&
        (
          clearedCount /
          totalCoverCount
        ) >= 0.34
      ) {

        triggerMemoryRevealed();
      }
    }

    function onPointerDown(e) {

      isInteracting =
        true;

      lastX =
        e.clientX;

      lastY =
        e.clientY;

      applyWipeAt(
        lastX,
        lastY,
        0,
        0
      );
    }

    function onPointerMove(e) {

      if (!isInteracting)
        return;

      const x =
        e.clientX;

      const y =
        e.clientY;

      const dx =
        x - lastX;

      const dy =
        y - lastY;

      const dist =
        Math.hypot(
          dx,
          dy
        );

      const steps =
        Math.max(
          1,
          Math.floor(
            dist / 14
          )
        );

      for (
        let i = 1;
        i <= steps;
        i++
      ) {

        const ix =
          lastX +
          (dx / steps) * i;

        const iy =
          lastY +
          (dy / steps) * i;

        applyWipeAt(
          ix,
          iy,
          dx * 0.2,
          dy * 0.2
        );
      }

      lastX = x;
      lastY = y;
    }

    function onPointerUp() {
      isInteracting =
        false;
    }

    canvas.addEventListener(
      'pointerdown',
      onPointerDown
    );

    window.addEventListener(
      'pointermove',
      onPointerMove
    );

    window.addEventListener(
      'pointerup',
      onPointerUp
    );

    window.addEventListener(
      'pointercancel',
      onPointerUp
    );

    /* ==========================================================================
       PROGRESSION
       ========================================================================== */

    function triggerMemoryRevealed() {

      isTransitioning =
        true;

      const currentMem =
        document.getElementById(
          `mem-${currentStep}`
        );

      currentMem.classList.add(
        'revealed'
      );

      particles.forEach(
        p => {

          if (!p.active) {

            p.active = true;

            p.vx =
              (Math.random() - 0.5) *
              1.5;

            p.vy =
              -Math.random() *
              1.8;

            p.decay =
              0.016 +
              Math.random() *
              0.01;
          }
        }
      );

      setTimeout(
        () => {

          if (
            currentStep < 2
          ) {

            currentMem.classList.add(
              'retiring'
            );

            setTimeout(
              () => {

                generateCoverForMemory(
                  currentStep + 1
                );

              },
              1000
            );

          } else {

            launchFinale();
          }

        },
        2600
      );
    }

    function launchFinale() {

      const currentMem =
        document.getElementById(
          'mem-2'
        );

      currentMem.classList.add(
        'retiring'
      );

      particles.forEach(
        p => {

          p.active = true;

          p.vx =
            (Math.random() - 0.5) *
            2.8;

          p.vy =
            (Math.random() - 0.5) *
            2.8;

          p.decay =
            0.014;
        }
      );

      setTimeout(
        () => {

          document
            .getElementById(
              'content-layer'
            )
            .style.display =
            'none';

          canvas.style.pointerEvents =
            'none';

          document
            .getElementById(
              'pigment-wash'
            )
            .style.opacity =
            '1';

          document
            .getElementById(
              'finale-layer'
            )
            .classList.add(
              'show'
            );

        },
        1200
      );
    }

    /* ==========================================================================
       ANIMATION LOOP
       ========================================================================== */

    function frame() {

      ctx.clearRect(
        0,
        0,
        W,
        H
      );

      for (
        let i =
          particles.length - 1;
        i >= 0;
        i--
      ) {

        const p =
          particles[i];

        p.update();

        if (
          p.alpha <= 0
        ) {

          particles.splice(
            i,
            1
          );

        } else {

          p.draw();
        }
      }

      requestAnimationFrame(
        frame
      );
    }

    requestAnimationFrame(
      frame
    );

    /* ==========================================================================
       INITIAL LAUNCH
       ========================================================================== */

    window.addEventListener(
      'DOMContentLoaded',
      () => {
        generateCoverForMemory(0);
      }
    );
  </script>

</body>
</html>
